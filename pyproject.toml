[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-engine-showcase"
version = "0.1.0"
description = "Selected engineering components from a private football decision-engine project"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31,<3"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
